
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8090}

# PostgreSQL
spring.datasource.url=postgresql://neondb_owner:npg_1dBeksMfVm9u@ep-royal-cake-aoya9goy-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
